[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "NEAT"
version = "4.8.3"
description = "Bragg edge imaging data analysis."
authors = [
    { name = "Ruiyao Zhang", email = "ruiyao.zhang@stfc.ac.uk" }
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.14"
dependencies = [
    "PyQt5>=5.15",
    "matplotlib>=3.5",
    "numpy>=1.24",
    "scipy>=1.10",
    "astropy>=5",
    "pandas>=1.5",
    "openpyxl>=3.1",
    "h5py>=3.10",
    "psutil>=5.9",
    "Pillow>=10"
]

[project.optional-dependencies]
assistant = [
    "keyring>=25,<26",
    "langchain-anthropic>=1,<2",
    "langchain-chroma>=1.1,<2",
    "langchain-google-genai>=4,<5",
    "langchain-openai>=1.1,<2"
]
assistant-server = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1"
]
test = [
    "tomli>=2; python_version < '3.11'"
]

[tool.briefcase]
project_name = "NEAT"
bundle = "io.github.rayzhang2024"

[tool.briefcase.app.neat]
formal_name = "NEAT"

[tool.briefcase.app.neat.windows]
external_package_path = "dist/NEAT"
external_package_executable_path = "NEAT.exe"
system_installer = false
use_full_install_path = false
install_launcher = true

[project.scripts]
neat = "NEAT.app:main"
neat-assistant-server = "tools.assistant_shared_server:main"
neat-assistant-laptop-setup = "tools.configure_assistant_laptop:main"

[tool.setuptools.packages.find]
include = ["NEAT*", "tools*"]

[tool.setuptools.package-data]
NEAT = ["assets/*.png", "knowledge/*.md"]

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v4.8.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows-standalone:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set release version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }
          if (-not $tag.StartsWith("v")) {
            throw "Release tag must start with 'v'. Got: $tag"
          }
          $version = $tag.Substring(1)
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_PORTABLE=NEAT-$tag-portable.zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_MSI=NEAT-$tag.msi" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify release commit is contained in main
        shell: pwsh
        run: |
          git fetch origin main --tags
          $releaseCommit = git rev-parse HEAD
          $tagCommit = git rev-parse "$($env:RELEASE_TAG)^{commit}"
          if ($releaseCommit -ne $tagCommit) {
            throw "Checked-out commit $releaseCommit does not match release tag $env:RELEASE_TAG ($tagCommit)."
          }
          git merge-base --is-ancestor $tagCommit origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release commit $tagCommit is not contained in origin/main. Merge the release commit into main before tagging."
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[assistant,assistant-server]"
          python -m pip install pyinstaller build "briefcase==0.4.5"

      - name: Verify release tag matches package version
        shell: pwsh
        run: python -m tools.check_release_version --tag $env:RELEASE_TAG

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build and validate Python distributions
        shell: pwsh
        run: |
          python -m build --wheel --sdist --outdir dist\python
          python -m tools.validate_license_artifacts --artifacts-dir dist\python

      - name: Prepare automatic public shared access
        shell: pwsh
        env:
          NEAT_PUBLIC_SHARED_SERVICE_URL: https://ray.taild350ce.ts.net
          NEAT_PUBLIC_SHARED_ACCESS_TOKEN: ${{ secrets.NEAT_SHARED_PUBLIC_ACCESS_TOKEN }}
        run: python -m tools.prepare_public_shared_access

      - name: Build standalone app
        run: pyinstaller --noconfirm --clean NEAT.spec

      - name: Smoke test packaged imports and knowledge
        shell: pwsh
        run: |
          $result = Join-Path $env:RUNNER_TEMP "neat-release-smoke.txt"
          $env:NEAT_RELEASE_SMOKE_RESULT = $result
          $process = Start-Process -FilePath "dist\NEAT\NEAT.exe" -ArgumentList "--release-smoke-test" -Wait -PassThru -WindowStyle Hidden
          Get-Content $result
          if ($process.ExitCode -ne 0 -or -not (Select-String -Path $result -Pattern "^PASS$" -Quiet)) {
            throw "Packaged NEAT smoke test failed with exit code $($process.ExitCode)"
          }

      - name: Create canonical payload manifest
        run: python -m tools.windows_distribution manifest --payload dist/NEAT --output dist/NEAT-payload-manifest.json

      - name: Package portable ZIP
        run: python -m tools.windows_distribution portable --payload dist/NEAT --manifest dist/NEAT-payload-manifest.json --output "dist/${{ env.RELEASE_PORTABLE }}"

      - name: Clean Briefcase packaging state
        shell: pwsh
        run: python -m tools.clean_briefcase_state

      - name: Build per-user MSI from the validated payload
        shell: pwsh
        env:
          BRIEFCASE_HOME: ${{ runner.temp }}\neat-briefcase
        run: |
          python -m briefcase package windows -p msi --no-input --adhoc-sign
          if ($LASTEXITCODE -ne 0) { throw "Briefcase MSI packaging failed." }
          python -m tools.windows_distribution verify-briefcase --project-root .
          if ($LASTEXITCODE -ne 0) { throw "Briefcase external-payload verification failed." }
          $source = "dist\NEAT-$env:RELEASE_VERSION.msi"
          $target = "dist\$env:RELEASE_MSI"
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) { throw "Briefcase MSI not found: $source" }
          Move-Item -LiteralPath $source -Destination $target

      - name: Validate silent MSI lifecycle
        shell: pwsh
        run: |
          ./tools/windows_msi_smoke.ps1 -MsiPath "dist\$env:RELEASE_MSI" `
            -ManifestPath "dist\NEAT-payload-manifest.json" `
            -LogDirectory (Join-Path $env:RUNNER_TEMP "neat-msi-smoke-logs")

      - name: Upload portable workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_PORTABLE }}
          path: dist/${{ env.RELEASE_PORTABLE }}
          if-no-files-found: error

      - name: Upload MSI workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_MSI }}
          path: dist/${{ env.RELEASE_MSI }}
          if-no-files-found: error

      - name: Upload payload manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEAT-payload-manifest-${{ env.RELEASE_VERSION }}
          path: dist/NEAT-payload-manifest.json
          if-no-files-found: error

      - name: Upload MSI logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: neat-msi-failure-logs
          path: ${{ runner.temp }}/neat-msi-smoke-logs/*.log
          if-no-files-found: ignore

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: NEAT ${{ env.RELEASE_TAG }}
          body_path: CHANGELOG.md
          files: |
            dist/${{ env.RELEASE_PORTABLE }}
            dist/${{ env.RELEASE_MSI }}
          fail_on_unmatched_files: true
